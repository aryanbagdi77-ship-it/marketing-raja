<svg viewBox="0 0 1260 1260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7E7A6"/>
      <stop offset="20%" stop-color="#E8C765"/>
      <stop offset="45%" stop-color="#B8860B"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#F5DE8A"/>
      <stop offset="100%" stop-color="#C99A2E"/>
    </linearGradient>
    <linearGradient id="goldGradText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEFB4"/>
      <stop offset="30%" stop-color="#E7C158"/>
      <stop offset="50%" stop-color="#9C6E17"/>
      <stop offset="55%" stop-color="#C89B3C"/>
      <stop offset="80%" stop-color="#F6E2A0"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="bgVignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1260" height="1260" fill="url(#bgVignette)"/>

  <!-- Outer ring -->
  <ellipse cx="630" cy="630" rx="565" ry="580" fill="none" stroke="url(#goldGrad)" stroke-width="10"/>

  <!-- Crown circle -->
  <circle cx="630" cy="400" r="168" fill="none" stroke="url(#goldGrad)" stroke-width="7"/>

  <!-- Crown icon -->
  <g fill="url(#goldGrad)">
    <!-- crown base band -->
    <rect x="520" y="470" width="220" height="30" rx="4"/>
    <!-- crown body (zigzag points) -->
    <path d="M 520 470
             L 520 400
             L 565 440
             L 600 370
             L 630 320
             L 660 370
             L 695 440
             L 740 400
             L 740 470
             Z"/>
    <!-- points balls -->
    <circle cx="520" cy="392" r="12"/>
    <circle cx="600" cy="362" r="12"/>
    <circle cx="630" cy="308" r="13"/>
    <circle cx="660" cy="362" r="12"/>
    <circle cx="740" cy="392" r="12"/>
  </g>

  <!-- MARKETING -->
  <text x="630" y="690" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="108" letter-spacing="18" fill="#F5F5F0">MARKETING</text>

  <!-- BADSHAH -->
  <text x="630" y="850" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="168" letter-spacing="6" fill="url(#goldGradText)">BADSHAH</text>

  <!-- divider + subtitle -->
  <line x1="345" y1="905" x2="465" y2="905" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="630" y="915" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="6" fill="url(#goldGrad)">PERFORMANCE MARKETING</text>
  <line x1="795" y1="905" x2="915" y2="905" stroke="url(#goldGrad)" stroke-width="3"/>
</svg>
